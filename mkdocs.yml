# Project site, built from docs/. Preview: pip install -r docs/requirements.txt && mkdocs serve
site_name: aws-elastic-globus-compute
site_description: A Globus Compute endpoint engine on ephemeral AWS capacity
repo_url: https://github.com/scttfrdmn/aws-elastic-globus-compute
repo_name: scttfrdmn/aws-elastic-globus-compute
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-4, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-7, name: Light mode}

markdown_extensions:
  - tables
  - admonition
  - toc: {permalink: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Links to files outside docs/ (source, the README) become links to the repository.
hooks:
  - docs/hooks/repo_links.py

exclude_docs: |
  hooks/
  requirements.txt
  *.py

validation:
  links:
    not_found: warn
    anchors: warn

nav:
  - Get started:
      - Home: index.md
      - Quickstart: quickstart.md
  - Tutorials:
      - Overview: tutorials/index.md
      - "Sentinel-2 NDVI, from a notebook to nightly": tutorials/sentinel2-ndvi.md
      - "Slice before you ship: 1000 Genomes": tutorials/genomics-slice.md
      - A Spot sweep that survives interruptions: tutorials/spot-sweep.md
      - One flow, two endpoints: tutorials/two-endpoints.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - When to use aegc: concepts/when-to-use.md
      - Delivery and idempotency: concepts/delivery.md
      - Security model: concepts/security.md
      - Cost: concepts/cost.md
  - How-to:
      - Configure pools and endpoints: how-to/configuration.md
      - Build or bring worker images: how-to/images.md
      - Read and write your data: how-to/data.md
      - Operate a deployment: how-to/operations.md
      - "Watch tasks: logs, metrics, provenance": how-to/observability.md
      - Use Globus Flows and Timers: how-to/flows.md
      - Troubleshooting: how-to/troubleshooting.md
  - Reference:
      - CLI: reference/cli.md
      - Configuration: reference/configuration.md
      - Limits: reference/limits.md
      - IAM policies: reference/iam.md
      - Resources and tags: reference/resources.md
      - Performance: reference/performance.md
