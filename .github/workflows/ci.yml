name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv venv --python 3.13 && uv pip install -e '.[dev]'
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - run: make tools  # pinned substrate AWS emulator into .tools/
      - run: uv venv --python ${{ matrix.python }} && uv pip install -e '.[dev]'
      - run: uv run pytest
